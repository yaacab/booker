# Букер — nginx (канон https://bukergo.ru, остальные 301)

upstream booker_web {
    server 127.0.0.1:3030;
}

upstream booker_api {
    server 127.0.0.1:8030;
}

server {
    listen 80;
    listen [::]:80;
    server_tokens off;
    server_name bukergo.ru www.bukergo.ru bookergo.ru www.bookergo.ru bukergo.online www.bukergo.online;
    include /opt/booker/current/infra/nginx/booker-common-headers.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://bukergo.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_tokens off;
    server_name www.bukergo.ru bookergo.ru www.bookergo.ru bukergo.online www.bukergo.online;
    ssl_certificate /etc/letsencrypt/live/bukergo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bukergo.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /opt/booker/current/infra/nginx/booker-https-headers.conf;
    return 301 https://bukergo.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_tokens off;
    server_name bukergo.ru;
    ssl_certificate /etc/letsencrypt/live/bukergo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bukergo.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /opt/booker/current/infra/nginx/booker-https-headers.conf;
    client_max_body_size 6m;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location = /llms.txt {
        alias /opt/booker/current/docs/product/LLM_DESIGN.md;
        default_type text/plain;
        charset utf-8;
        add_header Access-Control-Allow-Origin *;
        add_header X-Robots-Tag "all";
        include /opt/booker/current/infra/nginx/booker-https-headers.conf;
    }

    location /api/ {
        proxy_pass http://booker_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/internal/readiness {
        include /opt/booker/current/infra/nginx/booker-https-headers.conf;
        add_header Cache-Control "no-store" always;
        return 404;
    }

    location /fonts/ {
        proxy_pass http://booker_web;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include /opt/booker/current/infra/nginx/booker-https-headers.conf;
    }

    location /_next/static/ {
        proxy_pass http://booker_web;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /opt/booker/current/infra/nginx/booker-https-headers.conf;
    }

    location / {
        proxy_pass http://booker_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-cache, no-store, max-age=0, must-revalidate" always;
        include /opt/booker/current/infra/nginx/booker-https-headers.conf;
    }
}

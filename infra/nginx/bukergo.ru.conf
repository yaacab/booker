# Букер — nginx (канон https://bukergo.ru, остальные 301)

upstream booker_web {
    server 127.0.0.1:3030;
}

upstream booker_api {
    server 127.0.0.1:8030;
}

server {
    listen 80;
    listen [::]:80;
    server_name bukergo.ru www.bukergo.ru bookergo.ru www.bookergo.ru bukergo.online www.bukergo.online;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://bukergo.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.bukergo.ru bookergo.ru www.bookergo.ru bukergo.online www.bukergo.online;
    ssl_certificate /etc/letsencrypt/live/bukergo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bukergo.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://bukergo.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bukergo.ru;
    ssl_certificate /etc/letsencrypt/live/bukergo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bukergo.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    client_max_body_size 6m;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location = /llms.txt {
        alias /opt/booker/docs/product/LLM_DESIGN.md;
        default_type text/plain;
        charset utf-8;
        add_header Access-Control-Allow-Origin *;
        add_header X-Robots-Tag "all";
    }

    location /api/ {
        proxy_pass http://booker_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /fonts/ {
        proxy_pass http://booker_web;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://booker_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

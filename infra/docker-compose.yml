services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booker
      POSTGRES_PASSWORD: booker
      POSTGRES_DB: booker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - booker_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booker"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  booker_pg:

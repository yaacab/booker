name: ci
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  secret-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan project source and deploy payload
        run: python3 scripts/check_secret_exposure.py --source --deploy-payload

  dependency-audit:
    needs: secret-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Audit pinned Python graphs
        run: |
          python -m pip install pip-audit==2.10.1 uv==0.12.17
          uv pip compile apps/api/pyproject.toml --python-version 3.11 --constraint apps/api/requirements-prod.lock --no-annotate --no-header --output-file /tmp/booker-prod-resolved.lock
          cmp apps/api/requirements-prod.lock /tmp/booker-prod-resolved.lock
          uv pip compile apps/api/pyproject.toml --extra dev --python-version 3.11 --constraint apps/api/requirements.lock --no-annotate --no-header --output-file /tmp/booker-dev-resolved.lock
          cmp apps/api/requirements.lock /tmp/booker-dev-resolved.lock
          pip-audit -r apps/api/requirements-prod.lock --no-deps --disable-pip
          pip-audit -r apps/api/requirements.lock --no-deps --disable-pip
      - name: Audit web dependency graph
        working-directory: apps/web
        run: npm audit --audit-level=high

  api:
    needs: dependency-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -r requirements.lock
          pip install -e ".[dev]" --no-deps
          pip check
      - run: ruff check booker_api tests
      - run: pytest -q

  web:
    needs: dependency-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - name: Scan generated web assets
        working-directory: ${{ github.workspace }}
        run: python3 scripts/check_secret_exposure.py --build

  # Full browser suite and isolated recovery on the same candidate SHA.
  e2e-critical:
    needs: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOOKER_RUNTIME_ENV: test
      BOOKER_ALLOW_DEMO_SEED: "1"
      BOOKER_DATABASE_URL: sqlite:////tmp/booker-ci-full.db
      BOOKER_UPLOAD_DIR: /tmp/booker-ci-full-uploads
      BOOKER_E2E_TOKEN_CACHE: ${{ format('/tmp/booker-ci-full-{0}.json', github.run_id) }}
      BOOKER_E2E_NEXT_DIST_DIR: .next
      BOOKER_E2E_WEB_MODE: production
      BOOKER_API_URL: http://127.0.0.1:18421
      NEXT_PUBLIC_API_URL: http://127.0.0.1:18421
      BOOKER_INTERNAL_API_URL: http://127.0.0.1:18421
      BOOKER_E2E_WEB_URL: http://127.0.0.1:13421
      BOOKER_CORS_ORIGINS: http://127.0.0.1:13421
      BOOKER_EMAIL_PROVIDER: disabled
      BOOKER_IN_APP_PROVIDER: dev
      BOOKER_PAYMENT_PROVIDER: stub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install isolated API environment
        working-directory: apps/api
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.lock
          .venv/bin/pip install -e ".[dev]" --no-deps
          .venv/bin/pip check
      - name: Web install + Playwright
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build web and scan generated assets
        working-directory: apps/web
        run: |
          npm run build
          python3 ../../scripts/check_secret_exposure.py --build
      - name: Full browser suite
        working-directory: apps/web
        run: npx playwright test --config=playwright.support-isolated.config.ts --reporter=line --output=/tmp/booker-ci-full-results
      - name: Staff recovery on a separate database
        working-directory: apps/web
        env:
          BOOKER_E2E_STAFF_RECOVERY_ISOLATED: "1"
          BOOKER_DATABASE_URL: sqlite:////tmp/booker-ci-recovery.db
          BOOKER_UPLOAD_DIR: /tmp/booker-ci-recovery-uploads
          BOOKER_E2E_TOKEN_CACHE: ${{ format('/tmp/booker-ci-recovery-{0}.json', github.run_id) }}
        run: npx playwright test --config=playwright.support-isolated.config.ts e2e/staff-recovery.spec.ts --reporter=line --output=/tmp/booker-ci-recovery-results
      - name: Preserve failed browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            /tmp/booker-ci-full-results
            /tmp/booker-ci-recovery-results
          retention-days: 7
